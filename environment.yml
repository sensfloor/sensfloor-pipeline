# Create env: conda env create -f environment.yml 
# Sync env with yml: conda env update -f environment.yml --prune 
name: sensfloor
channels:
  - defaults
dependencies:
  - python=3.11
  - matplotlib
  - numpy
  - tqdm
  - pandas
  - opencv
  - pip
  - pip:
    - torch
    - mediapipe==0.10.7
    - pyserial
    - trackio
    - websockets
